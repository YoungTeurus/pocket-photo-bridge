name: Headless bridge

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.label }} JVM tests and simulation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            label: x64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            label: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.12'
          architecture: ${{ matrix.architecture }}
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2; includes wrapper validation
      - name: Install headless Java desktop native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfreetype6 fontconfig
      - name: Test and build JVM distributions without Android SDK
        run: ./gradlew --no-daemon -PheadlessOnly=true :sony:test :printer:test :bridge:test :bridge:installDist :bridge:distZip :bridge:distTar
      - name: Smoke test the extracted JVM distribution on this architecture
        run: bash bridge/packaging/smoke-linux.sh bridge/build/distributions/bridge-0.4.0.tar
      - name: Create JVM archive checksums
        if: matrix.label == 'x64'
        working-directory: bridge/build/distributions
        run: sha256sum bridge-0.4.0.zip bridge-0.4.0.tar > bridge-0.4.0.sha256
      - name: Upload architecture-independent JVM distributions
        if: matrix.label == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-photo-bridge-jvm-0.4.0
          path: |
            bridge/build/distributions/bridge-0.4.0.zip
            bridge/build/distributions/bridge-0.4.0.tar
            bridge/build/distributions/bridge-0.4.0.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-verification-linux-${{ matrix.label }}
          path: |
            sony/build/reports/tests/test/
            sony/build/test-results/test/
            printer/build/reports/tests/test/
            printer/build/test-results/test/
            bridge/build/reports/tests/test/
            bridge/build/test-results/test/
            bridge/build/reports/smoke/linux/
          retention-days: 14

  windows:
    name: Windows x64 portable simulation
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.12'
          architecture: x64
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2; includes wrapper validation
      - name: Test and build the JVM distribution without Android SDK
        run: |
          .\gradlew.bat --no-daemon -PheadlessOnly=true :sony:test :printer:test :bridge:test :bridge:installDist
          if ($LASTEXITCODE -ne 0) { throw 'Headless Gradle verification failed.' }
      - name: Build the Windows app image and portable ZIP
        run: ./bridge/packaging/package-windows.ps1
      - name: Smoke test the extracted EXE without system Java
        run: ./bridge/packaging/smoke-windows.ps1
      - name: Upload portable Windows ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-photo-bridge-windows-x64-0.4.0
          path: |
            bridge/build/portable/windows-x64/PocketPhotoBridge-0.4.0-windows-x64.zip
            bridge/build/portable/windows-x64/PocketPhotoBridge-0.4.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-verification-windows-x64
          path: |
            sony/build/reports/tests/test/
            sony/build/test-results/test/
            printer/build/reports/tests/test/
            printer/build/test-results/test/
            bridge/build/reports/tests/test/
            bridge/build/test-results/test/
            bridge/build/reports/smoke/windows/
          retention-days: 14
